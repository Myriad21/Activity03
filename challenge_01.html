<!DOCTYPE HTML>
<html>
   <head>
      <title>Question and Answer</title>
      <style>

         body {
            font-family: Calibri, sans-serif;
            font-size: 3em;
         }

         #answer {
            color: black;
            width: 100px;

            /* Part of your solution goes here */
            animation-name: moveFraction;
            animation-duration: 5s;
            animation-delay: 1s;
         }

         /* moveFraction goes here */
         @keyframes moveFraction {
            0% {color: yellow; transform: translate(-355px, 60px);}
            50% {transform: translate(0px, 60px);}
            100% {transform: translate(0px, 0px); color: red;}
         }


         #question {
            /* Part of your solution goes here */
            transition: .3s ease;

         }

         #question:hover {
            /* Part of your solution goes here */
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);

         }

         span {
            display: inline-block;
         }

      </style>
   </head>
   <body>
      <span id="question">Question: &frac14; + &frac12; =</span>
      <span id="answer">&frac34;</span>
   </body>
</html>
